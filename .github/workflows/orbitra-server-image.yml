name: Orbitra Server Image

on:
  workflow_dispatch:

concurrency:
  group: orbitra-server-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish Linux server image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Require master branch
        run: test "${GITHUB_REF}" = "refs/heads/master"

      - name: Checkout Orbitra with RobustToolbox
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Orbitra image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.orbitra
          push: true
          build-args: |
            ORBITRA_IMAGE_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/endennsss/orbitra-station:latest
            ghcr.io/endennsss/orbitra-station:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
