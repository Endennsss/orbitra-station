name: "📣 Orbitra Changelog"

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      entry_id:
        description: 'ID записи для публикации (обязательно)'
        required: true
        type: string
      dry_run:
        description: 'Только предпросмотр, без отправки в Discord'
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
        sparse-checkout: |
          Tools/_Orbitra
          Resources/Changelog/_Orbitra
        persist-credentials: false
    - name: "📄 Предыдущая версия changelog"
      if: github.event_name == 'push'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const before = context.payload.before;
          if (!/^[0-9a-f]{40}$/.test(before || '') || /^0+$/.test(before)) {
            throw new Error('Нет предыдущего коммита. Используйте ручной запуск с ID записи.');
          }
          const {data} = await github.rest.repos.getContent({
            ...context.repo,
            path: 'Resources/Changelog/_Orbitra/updates.yml',
            ref: before
          });
          if (data.type !== 'file' || data.encoding !== 'base64' || !data.content) {
            throw new Error('Не удалось прочитать предыдущий changelog. Отправка остановлена.');
          }
          const filename = path.join(process.env.RUNNER_TEMP, 'orbitra-changelog-before.yml');
          fs.writeFileSync(filename, Buffer.from(data.content, 'base64'));
          core.exportVariable('CHANGELOG_BEFORE_FILE', filename);
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: "📚 Зависимости"
      run: python -m pip install PyYAML==6.0.3 requests==2.32.5
    - name: "🧪 Проверка публикатора"
      run: python -B -m unittest discover -s Tools/_Orbitra -p test_discord_changelog.py
    - name: "📣 Публикация обновлений"
      run: python -B Tools/_Orbitra/discord_changelog.py
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.ORBITRA_CHANGELOG_WEBHOOK }}
        CHANGELOG_BEFORE: ${{ github.event.before }}
        CHANGELOG_ENTRY_ID: ${{ inputs.entry_id }}
        CHANGELOG_DRY_RUN: ${{ inputs.dry_run }}
