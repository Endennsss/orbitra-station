name: "🏷️ Labels: Untriaged"

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  add_label:
    # Orbitra added start - право ставить метки Issues и PR
    permissions:
      issues: write
      pull-requests: write
    # Orbitra added end
    runs-on: ubuntu-latest
    steps:
    - uses: actions-ecosystem/action-add-labels@v1
      if: join(github.event.issue.labels) == ''
      with:
        labels: "📥 Не разобрано"
