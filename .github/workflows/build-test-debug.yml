name: Build & Test Debug

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  build:
    name: Build & Test Debug # Orbitra-Edit - имя обязательной проверки в ruleset
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    runs-on: ${{ matrix.os }}
    # Интеграционные тесты запускают клиент и сервер; полный набор регулярно
    # занимает больше часа на ubuntu-latest.
    timeout-minutes: 120

    steps:
    - name: Checkout Master
      uses: actions/checkout@v7

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Run Content.Tests
      if: matrix.shard == 0
      shell: pwsh
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=1 NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Run Content.IntegrationTests
      shell: pwsh
      run: |
        $env:DOTNET_gcServer=1
        $shard = [int]$env:SHARD_INDEX
        $shardCount = [int]$env:SHARD_COUNT
        $testRoot = Join-Path (Get-Location) "Content.IntegrationTests/Tests"
        $groups = @()

        # Распределяем отдельные тестовые классы, а не крупные каталоги. Раньше
        # весь _Orbitra попадал в один shard и job мог работать дольше лимита
        # runner-а, хотя остальные shards уже завершались.
        $seen = @{}
        foreach ($file in @(Get-ChildItem $testRoot -Recurse -File -Filter *.cs)) {
          $source = Get-Content $file.FullName -Raw
          $namespaceMatch = [regex]::Match($source, '(?m)^\s*namespace\s+([^;{]+)')
          if (-not $namespaceMatch.Success) {
            continue
          }
          $namespace = $namespaceMatch.Groups[1].Value.Trim()
          $testWeight = [Math]::Max(1, [regex]::Matches($source, '\[(?:Test|TestCase|TestCaseSource)(?:[^\]]*)\]').Count)
          foreach ($classMatch in [regex]::Matches($source, '(?m)\bclass\s+(\w+)')) {
            $className = $classMatch.Groups[1].Value
            $filter = "FullyQualifiedName~$namespace.$className"
            if ($seen.ContainsKey($filter)) {
              continue
            }
            $seen[$filter] = $true
            # Эти классы запускают полноценные server/client сценарии и заметно
            # тяжелее обычных unit-проверок, поэтому даём им больший вес.
            $weight = $testWeight
            if ($className -in @('EntityTest', 'StartTest', 'SaveLoadMapTest', 'TestRoundRestartCleanupEvent')) {
              $weight = [Math]::Max($weight, 40)
            }
            $groups += [pscustomobject]@{ Filter = $filter; Weight = $weight }
          }
        }
        if ($groups.Count -eq 0) {
          throw "Не удалось найти классы интеграционных тестов для распределения"
        }

        $loads = @(0) * $shardCount
        $selected = 0..($shardCount - 1) | ForEach-Object { ,@() }
        foreach ($group in ($groups | Sort-Object Weight -Descending)) {
          $target = 0..($shardCount - 1) | Sort-Object { $loads[$_] } | Select-Object -First 1
          $selected[$target] += $group.Filter
          $loads[$target] += $group.Weight
        }
        $filter = $selected[$shard] -join '|'
        Write-Host "Integration test shard $($shard + 1)/$($shardCount): $($selected[$shard].Count) filters, estimated weight $($loads[$shard])"

        # Длинные UI-тесты могут не писать в stdout несколько минут. Запускаем
        # тестовый процесс отдельно и печатаем heartbeat, чтобы GitHub runner
        # не отменял активный job из-за отсутствия вывода.
        $arguments = @(
          "test",
          "--no-build",
          "--configuration", "DebugOpt",
          "Content.IntegrationTests/Content.IntegrationTests.csproj",
          "--filter", $filter,
          "--",
          "NUnit.ConsoleOut=2",
          "NUnit.MapWarningTo=Failed",
          "NUnit.TestOutputXml=logs",
          "NUnit.WorkDirectory=$(pwd)/test_results"
        )
        $testProcess = Start-Process dotnet -ArgumentList $arguments -NoNewWindow -PassThru
        while (-not $testProcess.HasExited) {
          Write-Host "Content.IntegrationTests still running..."
          Start-Sleep -Seconds 60
          $testProcess.Refresh()
        }
        if ($testProcess.ExitCode -ne 0) {
          exit $testProcess.ExitCode
        }
      env:
        SHARD_INDEX: ${{ matrix.shard }}
        SHARD_COUNT: 8

    - name: Archive NUnit3 test results.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results-${{ matrix.os }}-shard-${{ matrix.shard }}
        path: test_results/*
        retention-days: 7
        compression-level: 9
  ci-success:
    name: Build & Test Debug
    if: always() # Orbitra-Edit: ошибка сборки не должна превращать обязательную проверку в skipped.
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        # Orbitra edit start - итог зависит от реального результата сборки и тестов.
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
        # Orbitra edit end
