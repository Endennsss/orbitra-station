name: Build & Test Debug

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  workflow_dispatch:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  SHARD_COUNT: '8'

jobs:
  build:
    name: Build Linux tests
    if: github.actor != 'PJBot' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update engine submodules
      run: git -C RobustToolbox submodule update --init --recursive

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Build Project
      run: dotnet build Content.IntegrationTests/Content.IntegrationTests.csproj --configuration DebugOpt -m:2 -nodeReuse:false

    - name: Discover and shard integration tests
      run: |
        mkdir -p test_filters
        dotnet vstest bin/Content.IntegrationTests/Content.IntegrationTests.dll \
          /ListFullyQualifiedTests /ListTestsTargetPath:test_filters/discovered.txt
        python3 Tools/_Orbitra/shard_integration_tests.py test_filters/discovered.txt test_filters --count "$SHARD_COUNT"
        tar -cf linux-tests.tar bin/Content.Tests bin/Content.IntegrationTests \
          bin/Content.Client bin/Content.Server RobustToolbox/Resources test_filters

    - uses: actions/upload-artifact@v4
      with:
        name: built-linux-tests
        path: linux-tests.tar
        if-no-files-found: error

  linux-tests:
    name: Linux tests
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - uses: actions/download-artifact@v4
      with:
        name: built-linux-tests

    - name: Extract test binaries
      run: tar -xf linux-tests.tar

    - name: Run Content.Tests
      if: matrix.shard == 0
      run: |
        mkdir -p test_results
        dotnet vstest bin/Content.Tests/Content.Tests.dll /ResultsDirectory:test_results -- \
          NUnit.ConsoleOut=1 NUnit.TestOutputXml=logs "NUnit.WorkDirectory=$PWD/test_results"

    - name: Run Content.IntegrationTests
      timeout-minutes: 100
      env:
        SHARD_INDEX: ${{ matrix.shard }}
        ORBITRA_INTEGRATION_TIMEOUT_MINUTES: 95
      run: |
        mkdir -p test_results
        filter=$(cat "test_filters/$SHARD_INDEX.filter")
        dotnet vstest bin/Content.IntegrationTests/Content.IntegrationTests.dll \
          "/TestCaseFilter:$filter" /ResultsDirectory:test_results \
          "/Blame:CollectHangDump;TestTimeout=20m;HangDumpType=none" -- \
          NUnit.ConsoleOut=2 NUnit.MapWarningTo=Failed NUnit.TestOutputXml=logs "NUnit.WorkDirectory=$PWD/test_results"

    - name: Archive NUnit3 test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results-ubuntu-latest-shard-${{ matrix.shard }}
        path: test_results/*
        retention-days: 7
        compression-level: 9

  ci-success:
    name: Build & Test Debug
    if: always() # Orbitra-Edit: ошибка сборки не должна превращать обязательную проверку в skipped.
    needs: [build, linux-tests]
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        # Orbitra edit start - итог зависит от реального результата сборки и тестов.
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.linux-tests.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success
        # Orbitra edit end
