- type: entity
  parent: BaseItem
  id: OrbitraXenoCultureBase
  name: slime culture
  description: A dormant laboratory culture. Add five units of water and place it on the floor to hatch a juvenile slime.
  suffix: Orbitra
  abstract: true
  components:
  - type: Sprite
    sprite: _Orbitra/Xenobiology/Objects/extract_jellies.rsi
    state: jelly
  - type: Item
    size: Small
    sprite: _Orbitra/Xenobiology/Objects/extract_jellies.rsi
  - type: SolutionManager
    solutions: [OrbitraXenoCultureSolution]
  - type: InjectableSolution
    solution: culture
  - type: RefillableSolution
    solution: culture
  - type: ExaminableSolution
    solution: culture
    exactVolume: true
  - type: StaticPrice
    price: 0

- type: entity
  parent: Solution
  id: OrbitraXenoCultureSolution
  suffix: Orbitra
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    id: culture
    solution:
      maxVol: 10

