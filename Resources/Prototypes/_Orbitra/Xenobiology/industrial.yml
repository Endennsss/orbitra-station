# Orbitra-Edit: катализатор связывает промышленную индукцию с исследованием третьего уровня.
- type: technology
  id: OrbitraIndustrialXenobiology
  name: research-technology-orbitra-industrial-xenobiology
  icon:
    sprite: _Orbitra/Xenobiology/Objects/extract.rsi
    state: core
  discipline: OrbitraBiochemical
  tier: 3
  cost: 15000
  technologyPrerequisites:
  - OrbitraXenobiologyAdvanced
  - IndustrialEngineering
  recipeUnlocks:
  - OrbitraXenoIndustrialCatalyst

- type: latheRecipe
  id: OrbitraXenoIndustrialCatalyst
  result: OrbitraXenoIndustrialCatalyst
  categories: [Tools]
  completetime: 5
  materials:
    Glass: 500
    Gold: 300
    Silver: 300
    Plasma: 500

- type: entity
  parent: BaseItem
  id: OrbitraXenoIndustrialCatalyst
  name: industrial induction catalyst
  description: A sealed catalyst for industrial slime induction. Its label specifies one living adult laboratory slime and six unused extracts of the same breed.
  suffix: Orbitra
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/bottle.rsi
    state: bottle-1
    color: '#e5d785'
  - type: Item
    size: Tiny
  - type: OrbitraXenobiologyIndustrialCatalyst
  - type: StaticPrice
    price: 0

# Orbitra-Edit: промышленные предметы не наследуют одноразовый компонент обычных экстрактов.
- type: entity
  parent: OrbitraXenoExtractBase
  id: OrbitraXenoIndustrialExtractBase
  name: industrial slime extract
  description: A dense industrial slime core. Its label specifies liquid plasma and uninterrupted operation on a floor outside containers.
  suffix: Orbitra
  abstract: true

- type: entity
  parent: OrbitraXenoIndustrialExtractBase
  id: OrbitraXenoIndustrialExtractMetal
  name: industrial metal extract
  suffix: Orbitra
