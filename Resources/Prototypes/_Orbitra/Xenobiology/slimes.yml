- type: entity
  id: OrbitraXenoSlimeBase
  parent: [BaseSimpleMob, MobCombat]
  abstract: true
  save: true
  suffix: Orbitra
  name: laboratory slime
  description: A gelatinous organism bred for its reactive extracts.
  components:
  - type: OrbitraXenobiologySlime
  - type: Sprite
    sprite: _Orbitra/Xenobiology/Mobs/slimesBaby.rsi
    layers:
    - state: base
      map: [enum.OrbitraXenobiologyLayers.Body]
  - type: GenericVisualizer
    visuals:
      enum.OrbitraXenobiologyVisuals.Stage:
        enum.OrbitraXenobiologyLayers.Body:
          Baby:
            sprite: _Orbitra/Xenobiology/Mobs/slimesBaby.rsi
            state: base
          Adult:
            sprite: _Orbitra/Xenobiology/Mobs/slimesAdult.rsi
            state: base
          DeadBaby:
            sprite: _Orbitra/Xenobiology/Mobs/slimesBaby.rsi
            state: dead
          DeadAdult:
            sprite: _Orbitra/Xenobiology/Mobs/slimesAdult.rsi
            state: dead
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.3
        density: 80
        mask: [MobMask]
        layer: [MobLayer]
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 2.5
  - type: Body
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OrbitraXenoSlimeStomach
  - type: Satiation
    satiations:
      Hunger:
        prototype: OrbitraXenoSlimeHunger
  - type: AtmosExposed
  - type: Temperature
    temperature: 293.15
    heatCapacity: 20000
    thermalConductivity: 200
  - type: NpcFactionMember
    factions: [OrbitraXenoSlimeCalm]
  - type: HTN
    rootTask:
      task: OrbitraXenoSlimeCompound
    blackboard:
      VisionRadius: !type:Single
        6
      AggroVisionRadius: !type:Single
        6
      MeleeRange: !type:Single
        1
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcBite
    soundHit:
      collection: FootstepSlime
    damage:
      types:
        Blunt: 3
        Caustic: 2
  - type: NameIdentifier
    group: GenericNumber
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: petting-success-slimes
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSlime
  - type: Tag
    tags: [FootstepSound]

- type: entity
  id: OrbitraXenoSlimeStomach
  parent: OrganAnimalStomach
  name: slime stomach
  description: An elastic digestive sac from a laboratory slime.
  suffix: Orbitra

- type: satiation
  id: OrbitraXenoSlimeHunger
  parent: SimpleMobBaseHunger
  baseChangeRate: -0.06
  startingValueMinimum: 65
  startingValueMaximum: 65

- type: npcFaction
  id: OrbitraXenoSlimeCalm
  friendly: [OrbitraXenoSlimeHungry]

- type: npcFaction
  id: OrbitraXenoSlimeHungry
  friendly: [OrbitraXenoSlimeCalm]
  hostile: [NanoTrasen, Syndicate, PetsNT]

- type: htnCompound
  id: OrbitraXenoSlimeCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:BaseSatiationPrecondition
        satiationType: Hunger
        below: Okay
      operator: !type:UtilityOperator
        proto: OrbitraXenoSlimeFood
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      operator: !type:AltInteractOperator
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: IdleTime
  - tasks:
    - !type:HTNCompoundTask
      task: MeleeCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

- type: utilityQuery
  id: OrbitraXenoSlimeFood
  query:
  - !type:ComponentQuery
    components:
    - type: Edible
  considerations:
  - !type:TargetIsAliveCon
    curve: !type:InverseBoolCurve
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:FoodValueCon
    hungerThreshold: Okay
    curve: !type:QuadraticCurve
      slope: 1.0
      exponent: 0.4
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve

