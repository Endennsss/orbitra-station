- type: entity
  parent: BaseItem
  id: OrbitraXenoExtractBase
  name: slime extract
  description: A single-use slime core. Consult the xenobiology console for the catalyst, dose and hazards before use.
  suffix: Orbitra
  abstract: true
  components:
  - type: Sprite
    sprite: _Orbitra/Xenobiology/Objects/extract.rsi
    state: core
  - type: Item
    size: Tiny
    sprite: _Orbitra/Xenobiology/Objects/extract.rsi
  - type: SolutionManager
    solutions: [OrbitraXenoExtractSolution]
  - type: InjectableSolution
    solution: extract
  - type: RefillableSolution
    solution: extract
  - type: ExaminableSolution
    solution: extract
    exactVolume: true
  - type: StaticPrice
    price: 0

- type: entity
  parent: Solution
  id: OrbitraXenoExtractSolution
  suffix: Orbitra
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    id: extract
    solution:
      maxVol: 15

- type: entity
  parent: OrbitraXenoExtractBase
  id: OrbitraXenoExtractGrey
