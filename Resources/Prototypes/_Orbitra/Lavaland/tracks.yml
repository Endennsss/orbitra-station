- type: entity
  id: OrbitraAshTrackBase
  abstract: true
  components:
  - type: OrbitraAshTrack
  - type: Clickable
  - type: Sprite
    drawdepth: FloorObjects

- type: entity
  parent: OrbitraAshTrackBase
  id: OrbitraAshMechTrack
  name: mech tracks
  description: Pairs of deep tread marks. A heavy walker crossed the ash here.
  components:
  - type: Sprite
    sprite: Effects/crayondecals.rsi
    rotation: 180
    layers:
    - state: footprint
      scale: 2.6, 2
      offset: -0.2, -0.17
      color: "#a68a72"
    - state: footprint
      scale: 2.25, 1.65
      offset: -0.2, -0.14
      color: "#594b43"
    - state: footprint
      scale: 2.6, 2
      offset: 0.2, 0.21
      color: "#a68a72"
    - state: footprint
      scale: 2.25, 1.65
      offset: 0.2, 0.24
      color: "#594b43"

- type: entity
  parent: OrbitraAshTrackBase
  id: OrbitraAshCable
  name: exposed red cable
  description: The wind has stripped the ash from a length of red cable.
  components:
  - type: Sprite
    sprite: Structures/Power/Cables/mv_cable.rsi
    layers:
    - state: mvcable_3
      color: "#ed4942"
    - state: mvstripes_3
      color: "#ff9a78"

- type: entity
  parent: OrbitraAshTrackBase
  id: OrbitraAshStretcherTrack
  name: stretcher tracks
  description: Two narrow wheel ruts scored the ash where someone hauled a stretcher.
  components:
  - type: Sprite
    sprite: Effects/crayondecals.rsi
    layers:
    - state: thinline
      offset: -0.21, 0
      color: "#93785e"
    - state: shortline
      offset: -0.18, -0.09
      color: "#bfa381"
    - state: thinline
      offset: 0.21, 0
      color: "#93785e"
    - state: shortline
      offset: 0.24, 0.14
      color: "#bfa381"
