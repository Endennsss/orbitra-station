- type: entity
  parent: BaseItem
  id: OrbitraRatvarIntegrationCog
  name: integration cog
  description: A sharp brass cog that spins of its own accord.
  components:
  - type: Sprite
    sprite: _Orbitra/Ratvar/mechanisms.rsi
    state: integration_cog
  - type: Item
    size: Small
  - type: OrbitraRatvarIntegrationCog
    openDelay: 5
    installDelay: 4
    removeDelay: 5
    interval: 2
    energyPerInterval: 20
    joulesPerEnergy: 100
    minimumChargeFraction: 0.5
    reserveEnergy: 20

- type: entity
  parent: BaseItem
  id: OrbitraRatvarTablet
  name: clockwork scripture tablet
  description: A brass tablet that answers only to the servants of Ratvar.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chapel/ratvartablet.rsi
    state: icon
  - type: Item
    sprite: Objects/Specific/Chapel/ratvartablet.rsi
    size: Small
  - type: OrbitraRatvarTablet
  - type: ActivatableUI
    key: enum.OrbitraRatvarUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.OrbitraRatvarUiKey.Key:
        type: OrbitraRatvarBoundUserInterface
  - type: GuideHelp
    guides: [OrbitraRatvar]

- type: entity
  parent: Paper
  id: OrbitraRatvarInstructions
  name: clockwork cult instructions
  components:
  - type: Paper
    content: orbitra-ratvar-instructions

- type: entity
  parent: ClockworkShield
  id: OrbitraRatvarShield
  name: clockwork shield

- type: entity
  parent: ClothingOuterArmorBase
  id: OrbitraRatvarArmor
  name: clockwork cuirass
  components:
  - type: Sprite
    sprite: _Orbitra/Ratvar/garb.rsi
    state: armor
  - type: Clothing
    sprite: _Orbitra/Ratvar/armor.rsi
  - type: Item
    inhandVisuals:
      left:
      - sprite: Clothing/OuterClothing/Armor/security.rsi
        state: inhand-left
        color: "#C6A45E"
      right:
      - sprite: Clothing/OuterClothing/Armor/security.rsi
        state: inhand-right
        color: "#C6A45E"

- type: entity
  parent: ClothingHeadHelmetArmoredBase
  id: OrbitraRatvarHelmet
  name: clockwork helmet
  components:
  - type: Sprite
    sprite: _Orbitra/Ratvar/garb.rsi
    state: helmet
  - type: Clothing
    sprite: _Orbitra/Ratvar/helmet.rsi
  - type: Item
    inhandVisuals:
      left:
      - sprite: Clothing/Head/Helmets/security.rsi
        state: inhand-left
        color: "#C6A45E"
      right:
      - sprite: Clothing/Head/Helmets/security.rsi
        state: inhand-right
        color: "#C6A45E"

- type: entity
  parent: Spear
  id: OrbitraRatvarSpear
  name: Ratvarian spear
  components:
  - type: Sprite
    sprite: _Orbitra/Ratvar/mechanisms.rsi
    layers:
    - state: spear
    - sprite: Objects/Weapons/Melee/spear.rsi
      state: spear1
      map: [enum.SolutionContainerLayers.Fill]
      visible: false
  - type: Item
    inhandVisuals:
      left:
      - sprite: _Orbitra/Ratvar/spear_left.rsi
        state: inhand-left
      right:
      - sprite: _Orbitra/Ratvar/spear_right.rsi
        state: inhand-right

- type: entity
  parent: [BaseMob, MobDamageable]
  id: OrbitraRatvarMarauder
  name: clockwork marauder
  description: A brass construct awaiting a willing servant of Ratvar.
  components:
  - type: Sprite
    sprite: _Orbitra/Ratvar/marauder.rsi
    layers:
    - state: alive
    - sprite: _Orbitra/Ratvar/sigils.rsi
      state: shield
      visible: false
      map: [enum.OrbitraRatvarMarauderLayers.Shield]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OrbitraRatvarVisuals.Defending:
        enum.OrbitraRatvarMarauderLayers.Shield:
          True: { visible: true }
          False: { visible: false }
  - type: OrbitraRatvarMarauder
  - type: OrbitraRatvarShell
  - type: NpcFactionMember
    factions: []
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3.5
  - type: CombatMode
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 15
  - type: Injurable
    damageContainer: Inorganic
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: GhostRole
    name: orbitra-ratvar-marauder-name
    description: orbitra-ratvar-marauder-independent-description
    rules: orbitra-ratvar-marauder-independent-rules
    makeSentient: true
    mindRoles: []
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
