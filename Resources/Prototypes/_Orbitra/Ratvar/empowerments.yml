- type: orbitraRatvarScripture
  id: OrbitraRatvarVanguard
  name: orbitra-ratvar-scripture-vanguard
  description: orbitra-ratvar-scripture-vanguard-desc
  tier: 2
  energy: 150
  delay: 1
  empowerment: Vanguard
  effectDuration: 30

- type: entity
  parent: Handcuffs
  id: OrbitraRatvarManacles
  name: replicant manacles
  description: Heavy brass restraints covered with tiny moving gears.
  components:
  - type: Sprite
    sprite: _Orbitra/Ratvar/manacles.rsi
    state: manacles
  - type: Item
    sprite: Objects/Misc/handcuffs.rsi
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#D8AD56"
      right:
      - state: inhand-right
        color: "#D8AD56"
  - type: Handcuff
    color: "#D8AD56"
    breakoutTime: 60
    breakOnRemove: true
    brokenPrototype: OrbitraRatvarManacleRemains

- type: entity
  id: OrbitraRatvarManacleRemains
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.1

- type: entity
  parent: MobStatusEffectBase
  id: OrbitraRatvarVanguardStatus
  name: vanguard
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Orbitra/Ratvar/sigils.rsi
    state: shield
    color: "#FFD98BA0"
  - type: IgnoreSlowOnDamage
