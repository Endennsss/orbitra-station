- type: entity
  parent: [ClothingEyesBase, PowerCellSlotSmallItem]
  id: OrbitraClothingEyesThermal
  name: thermal goggles
  description: Compact thermal imaging goggles that show nearby heat signatures. Solid walls and distance can obscure the image. Switch them on while wearing them.
  components:
  - type: Sprite
    sprite: _Orbitra/Clothing/Eyes/Goggles/thermal.rsi
  - type: Clothing
    sprite: _Orbitra/Clothing/Eyes/Goggles/thermal.rsi
  - type: OrbitraThermalVision
  - type: PowerCellDraw
    enabled: false
    drawRate: 1

- type: entity
  parent: BaseAction
  id: OrbitraActionToggleThermalVision
  name: Toggle thermal vision
  description: Switch the thermal imaging mode on or off while the goggles are worn.
  components:
  - type: Action
    useDelay: 0.3
  - type: Sprite
    sprite: _Orbitra/Clothing/Eyes/Goggles/thermal.rsi
    state: icon
  - type: InstantAction
    event: !type:OrbitraToggleThermalVisionEvent {}
