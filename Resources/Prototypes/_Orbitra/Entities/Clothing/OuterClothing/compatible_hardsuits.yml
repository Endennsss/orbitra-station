# Штатные спрайты и шлемы сохраняются; варианты закрывают ступени исследования без ресурсов Sunrise.
- type: entity
  parent: ClothingOuterHardsuitSpatio
  id: OrbitraClothingOuterHardsuitSpaceHazard
  name: hazard hardsuit
  description: An industrial spacesuit with additional shielding around the torso.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.8
        Radiation: 0.2
        Caustic: 0.4

- type: entity
  parent: ClothingOuterHardsuitEngineering
  id: OrbitraClothingOuterHardsuitEngineeringCompact
  name: compact engineering hardsuit
  description: An engineering spacesuit with a compact frame and articulated joints.
  components:
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85

# Чуть более подвижная штатная шахтёрская модель отделяет эту ступень от базового Salvage.
- type: entity
  parent: ClothingOuterHardsuitSalvage
  id: OrbitraClothingOuterHardsuitMining
  name: mobile mining hardsuit
  description: A reinforced mining spacesuit with articulated joints.
  components:
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
