- type: entity
  abstract: true
  id: OrbitraBaseVeinBluespaceCrystal
  suffix: Orbitra
  description: Blue crystals shimmer within the rock.
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OrbitraOreBluespaceCrystal
  - type: Sprite
    layers:
    - state: rock_bluespace_crystal
      sprite: _Orbitra/Structures/Walls/bluespace_ore.rsi
      map: ["enum.MiningScannerVisualLayers.Overlay"]

