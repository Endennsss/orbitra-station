- type: entity
  id: OperatingTable
  parent: Bed
  name: operating table
  description: Secure a patient on the table to examine their injuries and perform surgery. # Orbitra-Edit
  components:
  - type: Sprite
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
    noRot: true
  - type: Icon
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
  - type: AmbientMusicMarkerMedical
  # Orbitra added start
  - type: Strap
    buckleOnInteractHand: false
  - type: OrbitraSurgeryTable
  - type: ActivatableUI
    key: enum.OrbitraSurgeryUiKey.Key
    verbText: orbitra-surgery-open
    blockSpectators: true
  - type: UserInterface
    interfaces:
      enum.OrbitraSurgeryUiKey.Key:
        type: OrbitraSurgeryBoundUserInterface
        interactionRange: 1.5
  # Orbitra added end
