# PARAMETER EXPLANATIONS:

# realisticColors: If true, will randomly generate realistic hair and eye colors.
#                  Will also crush randomly generated colors down to the skin's luminosity
#                  so markings don't appear too bright on darker skin.
# squashEyeHairColors: If true, will also squash hair and eye colors to the coloration strategy.
#                      By default, only skin colors are affected!

- type: skinColoration
  id: Hues
  strategy: !type:ClampedHsvColoration
    value: [0.175, 1]

- type: skinColoration
  id: HumanToned
  strategy: !type:HumanTonedSkinColoration {}
  realisticColors: true
