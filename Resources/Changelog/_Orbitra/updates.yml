Name: OrbitraUpdates
AdminOnly: false
Order: -1
Entries:
- id: 94
  author: Endennsss
  time: '2026-10-05T12:00:00Z'
  changes:
  - type: Tweak
    message: Карточки приветствия антагонистов получили тематические цвета, тонкие рамки и плавный перелив заголовка. Для нулевого пациента добавлена розовая тема, для зомби — зелёная.
  - type: Add
    message: Осмотр предметов теперь дублируется в чате компактной карточкой с иконкой, названием и описанием.
  - type: Fix
    message: Повторные ответы осмотра больше не создают несколько одинаковых карточек, а чат сохраняет позицию при чтении старых сообщений.
  - type: Tweak
    message: Окно голосования приведено к общей серой палитре Orbitra и адаптировано для длинных названий.
- id: 93
  author: Endennsss
  time: '2026-10-03T21:55:20Z'
  changes:
  - type: Add
    message: Добавлена мрачная цветокоррекция игрового мира с настройкой интенсивности в графических параметрах.
- id: 92
  author: Endennsss
  time: '2026-09-28T19:48:09Z'
  changes:
  - type: Tweak
    message: 'Тест уведомлений Orbitra: проверяем доставку changelog, эмодзи и серое оформление карточки. Игровых изменений нет.'
- id: 91
  author: Endennsss
  time: '2026-09-28T19:28:13Z'
  changes:
  - type: Remove
    message: Убраны дым после выстрелов, пар изо рта на холоде и декоративная пыль.
  - type: Fix
    message: Возвращены индивидуальные цвета корпусов КПК и цвета выбранной темы HUD.
- id: 90
  author: Endennsss
  time: '2026-09-28T12:00:00+02:00'
  changes:
  - type: Add
    message: 'Добавлено административное событие «Брошенная станция»: потеря связи с ЦК временно отключает закупки, рейсы прибытия, внешние факсы и эвакуацию. Поздний вход доступен через крио, а восстановление связи запускает обязательную эвакуацию.'
  - type: Add
    message: Событие «Брошенная станция» сопровождается нейросетевыми голосовыми объявлениями и бирюзовым кодом «Изоляция» с аварийным освещением.
- id: 89
  author: Endennsss
  time: '2026-09-28T00:30:00+02:00'
  changes:
  - type: Tweak
    message: У термальных очков убрано собственное ограничение дальности обнаружения и подсветки. Сохранены штатная сетевая видимость, ограничение одной картой и исключение неподходящих целей.
- id: 88
  author: Endennsss
  time: '2026-09-28T00:00:00+02:00'
  changes:
  - type: Remove
    message: Культ Ратвара временно отключён. Его режим, роли, писания, механизмы и административные команды перенесены в архив исходников для дальнейшей доработки.
- id: 82
  author: Endennsss
  time: '2026-09-27T18:02:00+02:00'
  changes:
  - type: Fix
    message: Окна тайника, писаний и переходов культа стали компактнее. Длинные списки прокручиваются внутри окна, названия больше не растягивают его.
  - type: Tweak
    message: Недоступные переходы своего культа показывают причину отказа вместо исчезновения из списка. Удалённые точки по-прежнему убираются.
  - type: Tweak
    message: Цена писания десяти листов латуни увеличена с 30 до 100 энергии и приведена к курсу фабрикатора.
  - type: Add
    message: В табличке показан отдельный запас жизненности культа. В руководство добавлены правила лечения и возрождения на матрице жизненности.
- id: 81
  author: Endennsss
  time: '2026-09-27T22:00:00+02:00'
  changes:
  - type: Fix
    message: Исправлены отображение дохода и расхода энергии и обрезанные фильтры писаний Ратвара.
  - type: Tweak
    message: Ратвар перемещается плавнее, виден поверх стен и остаётся после итогов до перезапуска раунда. Во время его активности звучит музыкальное сопровождение.
  - type: Add
    message: Марадеры могут вскрывать двери через альтернативное взаимодействие. Защитный щит больше не вращается.
  - type: Tweak
    message: Расширено преобразование стен в латунь, включая укреплённые, ржавые и шаттловые стены. При осмотре механизмов показаны стоимость работы и пояснения о питании.
- id: 80
  author: Endennsss
  time: '2026-09-27T21:00:00+02:00'
  changes:
  - type: Add
    message: Добавлен административный тестовый режим культа Ратвара для одного или двух клиентов. Команда orbitra_ratvar_test выдаёт роль, настраивает ступень и запас энергии, позволяет читать писания и запускать ковчег без дополнительных участников.
- id: 79
  author: Endennsss
  time: '2026-09-27T15:58:00+02:00'
  changes:
  - type: Add
    message: Добавлены латунные рычаги, нажимные плиты, таймеры, шипы и подбрасыватели со спрайтами BeeStation. Ловушки соединяются табличкой в цепи своего культа и работают под покрытием печатей передачи.
  - type: Fix
    message: Исправлена загрузка спрайта когскараба после импорта состояний движения.
- id: 78
  author: Endennsss
  time: '2026-09-27T18:00:00+02:00'
  changes:
  - type: Add
    message: Добавлен тайник мастера с выбором облачения, скрывающего плаща и призрачных очков. Выдача снаряжения восстанавливается раз в четыре минуты.
  - type: Add
    message: Добавлены когскарабы с инструментами и фабрикатором. Культ может создать две оболочки; административный спавн не выдаёт членство автоматически.
  - type: Add
    message: Добавлены именованные точки перемещения культа на основной станции. Для перехода нужны питание обоих пунктов и свободное место назначения.
- id: 77
  author: Endennsss
  time: '2026-09-27T17:00:00+02:00'
  changes:
  - type: Add
    message: "Добавлено деятельное проявление Ратвара после победы культа: перемещение, притяжение и постепенное латунное преобразование поддерживаемых построек. Финал продлён до 30 секунд с огненным импульсом для некультистов основной станции."
- id: 76
  author: Endennsss
  time: '2026-09-27T16:00:00+02:00'
  changes:
  - type: Add
    message: Добавлено огненное благословение звездочёта. Оно уменьшает оружие, переводит его ближний урон в ожоговый и поджигает поражённые тела. Вода и обычное тушение сохраняют действие.
  - type: Fix
    message: Исправлена ошибка создания подсветки при первом появлении уже горящего тела на клиенте.
- id: 75
  author: Endennsss
  time: '2026-09-27T15:00:00+02:00'
  changes:
  - type: Add
    message: Добавлен звездочёт культа Ратвара с постоянными благословениями оружия (остротой, уменьшением и похищением жизненной силы). Ритуал занимает шесть секунд, восстановление постройки занимает три минуты.
  - type: Add
    message: Добавлены спрайты звездочёта и звук его активации из BeeStation с сохранением лицензии и авторской атрибуции. Добавлены световой эффект ритуала, подсказки и руководство.
- id: 74
  author: Endennsss
  time: '2026-09-27T14:00:00+02:00'
  changes:
  - type: Fix
    message: Исправлено начисление и расходование энергии культа при удалении шестерни, ЛКП или самого культа. Призма больше не расходует энергию на уже удаляемые цели.
  - type: Fix
    message: Доступ к обелиску ограничен участниками его собственного культа.
- id: 73
  author: Endennsss
  time: '2026-09-27T12:40:00+02:00'
  changes:
  - type: Fix
    message: Исправлена прочность ковчега Ратвара. Ковчег больше не разрушается при пороге обычного механизма и не завершает призыв после запроса на его удаление.
  - type: Fix
    message: Исправлено прерывание писаний при смене сознания или принадлежности к культу. Печать обращения снова работает после удаления предыдущей цели.
  - type: Fix
    message: Исправлено сохранение культовой фракции тела после удаления роли или завершения призыва победой либо поражением.
- id: 72
  author: Endennsss
  time: '2026-09-27T03:30:00+02:00'
  changes:
  - type: Tweak
    message: Для появления Ратвара перенесена оригинальная анимация бога из BeeStation с сохранением лицензии и атрибуции.
  - type: Add
    message: Добавлены звуки BeeStation для писаний, установки шестерни интеграции, активации и разрушения ковчега. Появление Ратвара использует звук из той же версии.
- id: 71
  author: Endennsss
  time: '2026-09-27T03:00:00+02:00'
  changes:
  - type: Add
    message: Добавлена линза подавления Ратвара. После включения она замедляет видимых противников и повреждает мехов, расходуя общую энергию через печать передачи.
  - type: Tweak
    message: Для линзы перенесены оригинальные спрайты BeeStation с анимацией, состоянием открепления и сохранением лицензии и авторства.
- id: 70
  author: Endennsss
  time: '2026-09-27T02:35:00+02:00'
  changes:
  - type: Fix
    message: Исправлен Авангард Ратвара, блокировавший восстановление выносливости вместе с её уроном.
  - type: Add
    message: Добавлена призма процветания Ратвара. Она лечит раненых своего культа за энергию печати передачи, накапливает извлечённые яды и выпускает их при разрушении.
  - type: Tweak
    message: Для призмы перенесены оригинальные состояния и анимация BeeStation с сохранением лицензии и атрибуции. При осмотре видны режим работы, питание и заполнение резервуара.
- id: 69
  author: Endennsss
  time: '2026-09-27T02:03:00+02:00'
  changes:
  - type: Add
    message: Марадер Ратвара получил щит на четыре попадания снарядов и ремонт сваркой. Ремонт восстанавливает один заряд и до десяти единиц прочности; способности доступны и самостоятельным админским телам.
  - type: Tweak
    message: Добавлены анимации попадания и разрушения щита из закреплённой версии BeeStation с сохранением атрибуции. При осмотре марадера отображается запас зарядов.
- id: 68
  author: Endennsss
  time: '2026-09-27T01:31:00+02:00'
  changes:
  - type: Add
    message: 'Расширено преобразование базы культа Ратвара: фабрикатор обрабатывает обычные стальные, белые, тёмные и деревянные покрытия, обычные и тонированные окна, станционные шлюзы отделов. Плата шлюза, кабели и трубы сохраняются.'
  - type: Tweak
    message: Латунные окна и двери получили спрайты из закреплённой версии BeeStation с сохранением лицензии и авторства. Добавлены стыковка окон и анимация дверей.
  - type: Fix
    message: Замедляющая печать больше не действует без владельца или после завершения своего культа.
- id: 67
  author: Endennsss
  time: '2026-09-27T00:41:00+02:00'
  changes:
  - type: Fix
    message: Обращение в культ Ратвара перенесено на печать подчинения и больше не конфликтует с писаниями таблички и Авангардом. Живой человек обращается после пяти секунд на печати при культисте рядом, без наручников и таблички. Выход цели или потеря поддержки сбрасывают прогресс.
- id: 66
  author: Endennsss
  time: '2026-09-26T23:56:00+02:00'
  changes:
  - type: Add
    message: Добавлены четыре писания Ратвара. Воспламенение оглушает и лишает голоса, Ненавистные оковы связывают цель, Компромисс стража лечит союзника ценой отравления применяющего, Авангард временно защищает от контроля и запрещает другие писания.
  - type: Tweak
    message: Добавлены подготовка и выбор цели удерживаемой табличкой с проверкой расстояния, препятствий, сознания и принадлежности к культу. Энергия направленных писаний расходуется только при успешном применении. Для репликантных оков добавлен спрайт BeeStation с сохранением атрибуции.
- id: 65
  author: Endennsss
  time: '2026-09-26T23:15:00+02:00'
  changes:
  - type: Add
    message: Добавлены печати передачи энергии культа Ратвара. Закреплённые печати питают механизмы своего культа в радиусе шести тайлов на одном гриде.
  - type: Tweak
    message: Обновлён окулярный страж. Он стреляет тепловыми снарядами на три тайла с двухсекундной паузой и расходует общую энергию культа. Для создания стража и печати передачи нужны два культиста.
  - type: Tweak
    message: Добавлены спрайты BeeStation для таблички, фабрикатора, их отображения в руках, латунного пола и баррикады. В табличке появились поиск, фильтр ступеней, показатели дохода и расхода энергии и причины недоступности писаний.
- id: 64
  author: Endennsss
  time: '2026-09-26T22:11:15+02:00'
  changes:
  - type: Add
    message: Добавлена переработка обычной стали и стекла в латунь фабрикатором Ратвара. Два листа дают один латунный, нечётный остаток сохраняется. Переработка не расходует энергию и разделяет секундную задержку с производством.
- id: 63
  author: Endennsss
  time: '2026-09-26T22:03:46+02:00'
  changes:
  - type: Add
    message: Добавлено производство латуни репликационным фабрикатором при активации в руке. За один раз создаётся до 50 листов по 10 энергии культа за лист, с секундной задержкой между партиями.
- id: 62
  author: Endennsss
  time: '2026-09-26T22:00:00+02:00'
  changes:
  - type: Add
    message: Добавлено преобразование целых закрытых серебряных, золотых и плазменных дверей в латунные фабрикатором Ратвара за 6 секунд и 200 энергии культа. Шлюзы и двери с электроникой или замками не затрагиваются.
- id: 61
  author: Endennsss
  time: '2026-09-26T21:00:00+02:00'
  changes:
  - type: Add
    message: Добавлено преобразование целого полноразмерного армированного окна в латунное фабрикатором Ратвара за 6 секунд и 200 энергии культа.
- id: 60
  author: Endennsss
  time: '2026-09-26T10:00:00+02:00'
  changes:
  - type: Add
    message: Добавлено преобразование целой обычной стены в латунную фабрикатором Ратвара за 6 секунд и 200 энергии культа.
- id: 59
  author: Endennsss
  time: '2026-09-26T02:00:00+02:00'
  changes:
  - type: Add
    message: Добавлена укладка латунного пола фабрикатором Ратвара на обычное и снежное основание за 2 секунды и 20 энергии культа.
- id: 58
  author: Endennsss
  time: '2026-09-26T00:54:00+02:00'
  changes:
  - type: Fix
    message: Устранены лишние обновления редактора при сохранении и смене персонажа, включая пересчёт уже закрытых вкладок маркировок.
- id: 57
  author: Endennsss
  time: '2026-09-26T00:08:00+02:00'
  changes:
  - type: Add
    message: Культу Ратвара добавлен репликационный фабрикатор с ремонтным режимом. Писание второй ступени создаёт инструмент для восстановления своих механизмов и латунных построек; ремонт занимает шесть секунд и расходует энергию только при завершении.
- id: 56
  author: Endennsss
  time: '2026-09-25T23:17:00+02:00'
  changes:
  - type: Add
    message: В меню строительства добавлены латунная стена, окно и дверь для обустройства базы Ратвара. Конструкции используют обычные материалы и разбираются инструментами; латунная дверь работает без питания и доступна всем.
  - type: Add
    message: Добавлены латунная напольная плитка и решётчатая баррикада. Плитка снимается ломом, баррикада разбирается кусачками и не перекрывает воздух.
- id: 55
  author: Endennsss
  time: '2026-09-25T20:44:00+02:00'
  changes:
  - type: Tweak
    message: Пассивные генераторы Ратвара заменены интеграционными шестернями. Шестерни устанавливаются в ЛКП, превращают заряд батареи в общую энергию культа и уничтожаются ломом через открытую панель.
  - type: Fix
    message: Добыча энергии шестернёй проверяет задержку и параметры установленного устройства внутри серверной операции, исключая повторное начисление в одном тике.
  - type: Fix
    message: Исправлено падение сервера при удалении ЛКП во время установки интеграционной шестерни. Связанные с ЛКП операции отменяются при его удалении.
- id: 54
  author: Endennsss
  time: '2026-09-25T20:10:00+02:00'
  changes:
  - type: Tweak
    message: Обращение Ратвара занимает пять секунд и больше не требует наручников. Цель может двигаться внутри печати, но выход с неё отменяет ритуал.
  - type: Fix
    message: Исправлен запуск ритуала обращения. Добавлены сообщения о причинах отказа и проверки потери таблички, сознания и исходной печати.
  - type: Fix
    message: Защита марадера работает независимо от членства в культе, имеет серверную задержку и видимый эффект. Админские марадеры не получают культовую роль автоматически.
  - type: Fix
    message: Стартовый подбор слуг Ратвара использует отдельное предпочтение культа.
  - type: Fix
    message: При остановке режима Ратвара тела теряют культовую принадлежность и фракцию. Роли сохраняются для итогов раунда, другие культы и врождённые способности марадеров не затрагиваются.
- id: 53
  author: Endennsss
  time: '2026-09-25T19:30:00+02:00'
  changes:
  - type: Fix
    message: Исправлено падение сервера при создании построек Ратвара и двойное оформление подсказок в контекстном меню.
  - type: Fix
