Name: OrbitraUpdates
AdminOnly: false
Order: -1
Entries:
- id: 58
  author: Endennsss
  time: '2026-09-26T00:54:00+02:00'
  changes:
  - type: Fix
    message: Устранены лишние обновления редактора при сохранении и смене персонажа, включая пересчёт уже закрытых вкладок маркировок.
- id: 57
  author: Endennsss
  time: '2026-09-26T00:08:00+02:00'
  changes:
  - type: Add
    message: Культу Ратвара добавлен репликационный фабрикатор с ремонтным режимом. Писание второй ступени создаёт инструмент для восстановления своих механизмов и латунных построек; ремонт занимает шесть секунд и расходует энергию только при завершении.
- id: 56
  author: Endennsss
  time: '2026-09-25T23:17:00+02:00'
  changes:
  - type: Add
    message: В меню строительства добавлены латунная стена, окно и дверь для обустройства базы Ратвара. Конструкции используют обычные материалы и разбираются инструментами; латунная дверь работает без питания и доступна всем.
  - type: Add
    message: Добавлены латунная напольная плитка и решётчатая баррикада. Плитка снимается ломом, баррикада разбирается кусачками и не перекрывает воздух.
- id: 55
  author: Endennsss
  time: '2026-09-25T20:44:00+02:00'
  changes:
  - type: Tweak
    message: Пассивные генераторы Ратвара заменены интеграционными шестернями. Шестерни устанавливаются в ЛКП, превращают заряд батареи в общую энергию культа и уничтожаются ломом через открытую панель.
  - type: Fix
    message: Добыча энергии шестернёй проверяет задержку и параметры установленного устройства внутри серверной операции, исключая повторное начисление в одном тике.
  - type: Fix
    message: Исправлено падение сервера при удалении ЛКП во время установки интеграционной шестерни. Связанные с ЛКП операции отменяются при его удалении.
- id: 54
  author: Endennsss
  time: '2026-09-25T20:10:00+02:00'
  changes:
  - type: Tweak
    message: Обращение Ратвара занимает пять секунд и больше не требует наручников. Цель может двигаться внутри печати, но выход с неё отменяет ритуал.
  - type: Fix
    message: Исправлен запуск ритуала обращения. Добавлены сообщения о причинах отказа и проверки потери таблички, сознания и исходной печати.
  - type: Fix
    message: Защита марадера работает независимо от членства в культе, имеет серверную задержку и видимый эффект. Админские марадеры не получают культовую роль автоматически.
  - type: Fix
    message: Стартовый подбор слуг Ратвара использует отдельное предпочтение культа.
  - type: Fix
    message: При остановке режима Ратвара тела теряют культовую принадлежность и фракцию. Роли сохраняются для итогов раунда, другие культы и врождённые способности марадеров не затрагиваются.
- id: 53
  author: Endennsss
  time: '2026-09-25T19:30:00+02:00'
  changes:
  - type: Fix
    message: Исправлено падение сервера при создании построек Ратвара и двойное оформление подсказок в контекстном меню.
  - type: Fix
    message: Исправлено падение сервера при открытии контекстного меню генератора и обелиска Ратвара. Для построек исправлен путь разборки.
  - type: Add
    message: Добавлен коллективный разум культа через «+р текст» в обычном чате, без рации и таблички.
  - type: Tweak
    message: Наставления Ратвара убраны из стартового снаряжения.
- id: 52
  author: Endennsss
  time: '2026-09-25T19:00:00+02:00'
  changes:
  - type: Add
    message: В меню выдачи антагонистов добавлен культист Ратвара с привязкой к культу и стартовым снаряжением. Ручная выдача доступна и для одиночного тестирования.
- id: 51
  author: Endennsss
  time: '2026-09-25T18:30:00+02:00'
  changes:
  - type: Add
    message: Добавлен отдельный режим культа Ратвара с писаниями, общей энергией, обращением, латунными механизмами, марадером для призраков и защитой ковчега на станции. Режим не добавлен в «Секрет».
  - type: Add
    message: Добавлены табличка писаний в стиле Orbitra, закрытая связь культа и руководство. Святая вода снимает влияние культа и временно защищает от повторного обращения.
- id: 50
  author: Endennsss
  time: '2026-09-25T00:45:00+02:00'
  changes:
  - type: Tweak
    message: Термальное зрение плавно подстраивает яркость под освещение и слегка затемняет края изображения. Уменьшение анимаций отключает плавную адаптацию.
- id: 49
  author: Endennsss
  time: '2026-09-25T00:30:00+02:00'
  changes:
  - type: Tweak
    message: Радиус обнаружения термальных очков Orbitra увеличен с семи до десяти тайлов.
- id: 48
  author: Endennsss
  time: '2026-09-25T00:00:00+02:00'
  changes:
  - type: Fix
    message: Термальные очки подсвечивают настоящие спрайты и следуют их движению без отдельной задерживающейся фигуры. Добавлена жёлто-оранжевая подсветка на холодном фиолетовом фоне.
- id: 47
  author: Endennsss
  time: '2026-09-24T23:00:00+02:00'
  changes:
  - type: Add
    message: Добавлены термальные очки Orbitra для админ-спавна. Переключаемый режим показывает обезличенные тепловые силуэты живых существ сквозь стены в радиусе семи тайлов.
- id: 46
  author: Endennsss
  time: '2026-09-24T22:00:00+02:00'
  changes:
  - type: Fix
    message: Восстановлен выбор волос и маркировок при первом открытии редактора персонажа. Кнопка снаряжения выровнена с приоритетами.
  - type: Tweak
    message: Для создания персонажей доступны только люди. Убрана пустая нижняя область настроек, уведомления появляются слева.
- id: 45
  author: Endennsss
  time: '2026-09-24T21:00:00+02:00'
  changes:
  - type: Fix
    message: Имена персонажей на кириллице больше не удаляются и не заменяются случайными при сохранении профиля.
  - type: Tweak
    message: Итоги раунда, панель призрака, список ролей и подтверждение их правил приведены к стилю Orbitra. В манифесте выровнены колонки и добавлен перенос длинного текста.
- id: 44
  author: Endennsss
  time: '2026-09-24T12:00:00+02:00'
  changes:
  - type: Tweak
    message: Карточки персонажей и колесо эмоций приведены к оформлению Orbitra. Колесо плавно появляется и подсвечивает выбранный сектор с учётом настройки уменьшения анимаций.
  - type: Add
    message: В телепорте призрака добавлены цветовые акценты отделов и отдельная вкладка антагонистов.
  - type: Tweak
    message: Между эмоциями игрока установлена общая задержка в две секунды для меню, быстрых кнопок и текстовых команд. Автоматические реакции не ограничиваются.
- id: 43
  author: Endennsss
  time: '2026-09-23T18:00:00+02:00'
  changes:
  - type: Fix
    message: Исправлены неоднородные фоны строк, рамка поиска действий, выравнивание таблицы объектов и обрезание нижних действий строительства. Панель спавна переносит действия при нехватке ширины.
  - type: Tweak
    message: Песочница, административные инструменты, информация о персонаже, строительство и действия приведены к общему оформлению Orbitra. Добавлены служебные значки Lucide и адаптивная компоновка.
  - type: Fix
    message: Исправлены перенос действий AHelp и повторные подписки в атмосферных инструментах. Панель подготовки к смене стала шире и выровнена по высоте с чатом.
- id: 42
  author: Endennsss
  time: '2026-09-23T12:00:00+02:00'
  changes:
  - type: Tweak
    message: Шапки окон стали компактнее; добавлены единые контурные значки и подсказки Orbitra. Телепорт призрака стал шире, а быстрые действия перенесены к поиску.
  - type: Add
    message: Настройки и редактор персонажа показывают результат действий в отдельной закреплённой области без смещения кнопок.
- id: 41
  author: Endennsss
  time: '2026-09-23T00:00:00+02:00'
  changes:
  - type: Add
    message: В интерфейс Orbitra добавлены обход элементов клавишей Tab, управление ползунками и клавиатурный поиск руководства и целей призрака.
  - type: Tweak
    message: Меню телепорта показывает сводку целей, отсутствие результатов и состояние загрузки с повторной попыткой.
- id: 40
  author: Endennsss
  time: '2026-09-22T23:00:00+02:00'
  changes:
  - type: Tweak
    message: Общие компоненты Orbitra объединены в UI-kit с едиными размерами, ролями кнопок и адаптивными формами настроек.
  - type: Add
    message: В руководстве появились поиск по названиям и разделам и навигационный путь над статьёй.
  - type: Tweak
    message: Цели телепорта призрака сгруппированы по сворачиваемым отделам; рядом с именем показан значок профессии. Поиск учитывает имя, профессию и отдел.
- id: 39
  author: Endennsss
  time: '2026-09-22T22:00:00+02:00'
  changes:
  - type: Fix
    message: Исправлены пропуски проявления меню при первом и повторном открытии, быстрые развороты переходов и преждевременное завершение при перерасчёте содержимого.
  - type: Tweak
    message: Общие окна, панели и выпадающие меню плавно затухают при пользовательском закрытии; ввод отключается сразу. Уменьшение движения отключает переходы.
  - type: Fix
    message: Настройки графики безопасно открываются до подключения к серверу; предпросмотр Bloom и частиц не обращается к ещё не запущенным игровым системам.
- id: 38
  author: Endennsss
  time: '2026-09-22T21:00:00+02:00'
  changes:
  - type: Fix
    message: Исправлены сжатие игрового меню, ширина разделов руководства и исчезновение подписей переключателей в настройках.
  - type: Fix
    message: Проявление окон и выпадающих меню корректно повторяется после закрытия, включая быстрое повторное открытие.
- id: 37
  author: Endennsss
  time: '2026-09-22T20:00:00+02:00'
  changes:
  - type: Tweak
    message: Общие меню получили единое серое оформление и короткие плавные переходы как в лобби, так и в раунде. Обновлены позднее присоединение, манифест и игровое меню.
  - type: Fix
    message: На узких экранах действия настроек и привязки клавиш переносятся, а разделы руководства открываются поверх статьи. Игровой HUD и интерфейсы устройств не изменены.
- id: 36
  author: Endennsss
  time: '2026-09-22T18:00:00+02:00'
  changes:
  - type: Tweak
    message: Главное меню, лобби, персонализация и входные окна получили короткие плавные переходы. Панели выезжают без сдвига соседних элементов, вкладки и списки мягко появляются, кнопки плавно меняют цвет.
  - type: Tweak
    message: Добавлен мягкий отклик готовности и сохранения профиля. Настройка уменьшения движения отключает новые анимации.
- id: 35
  author: Endennsss
  time: '2026-09-22T12:00:00+02:00'
  changes:
  - type: Tweak
    message: В лобби появилась карточка экипажа с логотипом Orbitra вместо декоративных дуг. Карточка и кнопки входа центрируются независимо от чата и информации о сервере.
  - type: Fix
    message: Переключение персонажей сохраняет уходящее превью и больше не перестраивает скрытый редактор; повторные обновления профиля не прерывают переход.
  - type: Tweak
    message: Входные окна получили общую прямоугольную оболочку. В обновлениях появились постоянные прокручиваемые вкладки и загрузка разделов по запросу.
  - type: Fix
    message: Длинные журналы обновлений создают только видимые строки с запасом, не перестраиваются при обычной прокрутке и сохраняют положение при изменении ширины.
- id: 34
  author: Endennsss
  time: '2026-09-22T01:00:00+02:00'
  changes:
  - type: Tweak
    message: Кнопки входа в раунд закреплены внизу лобби и увеличены; у превью появились тонкие орбитальные дуги и плавное переключение персонажей с поддержкой уменьшения движения.
  - type: Fix
    message: Выровнены поля внешности. Выпадающие списки стали компактнее и ограничены экраном; профессии и категории снаряжения получили компактный режим без потери выбора.
  - type: Fix
    message: Вкладки обновлений больше не собираются в несколько рядов на узком окне; параметры голосования прокручиваются отдельно от кнопки создания, а действия AHelp переносятся без обрезания.
- id: 33
  author: Endennsss
  time: '2026-09-22T00:00:00+02:00'
  changes:
  - type: Fix
    message: Главное меню больше не сжимается при подготовке лобби; поля подключения получили полную ширину. Dev-лобби использует порт 1214 и отдельную совместимую сборку сервера.
  - type: Tweak
    message: В главное меню добавлен новый логотип Orbitra.
- id: 32
  author: Endennsss
  time: '2026-09-21T22:00:00+00:00'
  changes:
  - type: Tweak
    message: Проект переименован в Orbitra. Обновлены технические имена и ресурсы, добавлены перенос настроек Lime и конвертер старых карт.
  - type: Tweak
    message: Входной интерфейс получил единое серое оформление, компактные формы и настройки. Окна удерживаются в границах экрана без постоянного возврата в центр.
- id: 31
  author: Endennsss
  time: '2026-09-21T21:00:00+00:00'
  changes:
  - type: Fix
    message: Исправлено переполнение полей персонализации, убраны пустые промежутки между колонками и ошибка маркировок на узких окнах. Экипировка открывается по центру, правила и статистика ограничены экраном.
  - type: Tweak
    message: Выпадающие меню, поля, ползунки, вкладки и подтверждение сохранения приведены к общему оформлению редактора.
- id: 30
  author: Endennsss
  time: '2026-09-21T20:00:00+00:00'
  changes:
  - type: Fix
    message: В персонализации скрыта панель лобби и чат. На низких окнах превью стало компактнее, уменьшены отступы, меню дополнительных действий получило прокрутку.
- id: 29
  author: Endennsss
  time: '2026-09-21T19:00:00+00:00'
  changes:
  - type: Tweak
    message: Персонализация получила единый серый интерфейс с навигацией по разделам, постоянным превью, компактным выбором персонажа и адаптацией к широким и небольшим экранам. Добавлен поиск профессий и обновлено оформление экипировки.
  - type: Fix
    message: При смене или создании персонажа редактор предлагает сохранить или отменить несохранённые изменения.
- id: 28
  author: Endennsss
  time: '2026-09-21T18:00:00+00:00'
  changes:
  - type: Tweak
    message: Лобби получило серое оформление с персонажем в центре, отдельным чатом и компактной карточкой готовности. Боковые секции адаптируются к размеру окна.
  - type: Add
    message: Сохранённых персонажей можно переключать стрелками прямо в лобби, а превью — поворачивать отдельно. При смене персонажа готовность снимается.
- id: 27
  author: Endennsss
  time: '2026-09-21T17:00:00+00:00'
  changes:
  - type: Add
    message: 'В меню dev-клиента добавлена кнопка «Подключиться напрямую + лобби»: она запускает отдельный локальный сервер с лобби и подключается к нему. Запущенный таким способом сервер закрывается вместе с клиентом.'
- id: 26
  author: Endennsss
  time: '2026-09-21T15:00:00+00:00'
  changes:
  - type: Add
    message: Пули выбивают компактные частицы материала из поверхностей и оставляют временные следы на закреплённых конструкциях. Следы ограничены общим бюджетом и исчезают при разрушении цели.
  - type: Tweak
    message: Вспышка выстрела стала короче; импульс света учитывает семейство оружия и больше не изменяет постоянный фонарь. После быстрой очереди из огнестрельного оружия появляется небольшой дымок.
- id: 25
  author: Endennsss
  time: '2026-09-21T12:00:00+00:00'
  changes:
  - type: Fix
    message: Пылинки возле ламп стали заметнее без увеличения их количества; пропущенные кадры отрисовки больше не сбрасывают таймер появления.
  - type: Add
    message: 'У зоны пыли появился квадратный значок размещения, а в меню песочницы — переключатель «Отображать поля» для значков, границ и размеров зон.'
- id: 24
  author: Endennsss
  time: '2026-09-20T12:00:00+00:00'
  changes:
  - type: Add
    message: 'Добавлены редкие пылинки возле стационарных ламп в областях маркера «Lime: зона пыли» и небольшие облачка от тяжёлых приземлений, столкновений и разрушения стен. Эффекты используют общий ограниченный пул; фоновая пыль уступает место рабочим частицам.'
- id: 23
  author: Endennsss
  time: '2026-09-20T10:00:00+00:00'
  changes:
  - type: Fix
    message: Исправлена привязка холодного выдоха к голове и высота облачка у дворфов. Выдох не рисуется поверх затылка при взгляде строго со спины; исправлены диагональные направления и приоритет дыма в пуле частиц.
- id: 22
  author: Endennsss
  time: '2026-09-20T09:00:00+00:00'
  changes:
  - type: Add
    message: У живых дышащих существ на холоде появляются небольшие облачка выдоха. Закрывающие рот маски и шлемы скрывают эффект; в вакууме он отсутствует. Используются общий лимит и настройка качества частиц.
- id: 21
  author: Endennsss
  time: '2026-09-20T08:00:00+00:00'
  changes:
  - type: Fix
    message: Исправлен спам ошибок Appearance и связанные тормоза при обработке частиц на мостиках и других объектах без визуального состояния. Неактивные источники пропускаются до расчётов, пустой пул не запускает отрисовку.
- id: 20
  author: Endennsss
  time: '2026-09-20T07:00:00+00:00'
  changes:
  - type: Add
    message: При ударах и попаданиях снарядов по существам с кровью появляются короткие косметические брызги её цвета.
  - type: Tweak
    message: Угольки и дым горящих персонажей распределены вокруг тела и поднимаются выше, чтобы быть заметнее на фоне пламени.
- id: 19
  author: Endennsss
  time: '2026-09-20T06:00:00+00:00'
  changes:
  - type: Fix
    message: Исправлены перенос цвета между источниками Bloom и отсутствие электрических искр при разрушении консолей с заменой корпуса.
  - type: Tweak
    message: Свечение Bloom стало компактнее и плотнее возле источника; качество больше не увеличивает радиус ореола.
- id: 18
  author: Endennsss
  time: '2026-09-20T03:00:00+00:00'
  changes:
  - type: Add
    message: Добавлены косметические искры при сварке и поломке запитанной техники, угольки и лёгкий дым при горении, пыль и стружка при работе инструментами и ударах по конструкциям. Плотность частиц регулируется в настройках графики.
- id: 17
  author: Endennsss
  time: '2026-09-20T00:00:00+00:00'
  changes:
  - type: Add
    message: Добавлен режим приборного ПНВ с зелёным изображением, широкой виньеткой, помехами, пересветом и плавной адаптацией к освещению. Тестовые очки доступны через админ-спавн.
  - type: Fix
    message: Переработан Bloom ламп, экранов и индикаторов — свечение привязано к объектам, не создаёт светящихся конусов и не затрагивает интерфейс. Сила и качество регулируются в настройках графики.
  - type: Tweak
    message: Для персонажей оставлены люди, дворфы и унатхи. Удалены остальные игровые расы и зависящие от них механики; независимые тематические предметы сохранены.
  - type: Fix
    message: Исправлены атмосфера и герметичность стартовой комнаты Dev-карты, вызывавшие постепенный урон после появления персонажа.
  - type: Tweak
    message: Индикаторы длительных действий теперь плавно появляются и поднимаются над объектом.
- id: 15
  author: Endennsss
  time: '2026-09-17T21:00:00+00:00'
  changes:
  - type: Fix
    message: Удалены прежние нестабильные реализации Bloom и растворения, базовое освещение возвращено к штатной реализации RobustToolbox.
- id: 14
  author: Endennsss
  time: '2026-09-17T18:00:00+00:00'
  changes:
  - type: Fix
    message: Прыжок больше не поворачивает персонажа и гарантированно возвращает спрайт в исходное положение после приземления.
- id: 13
  author: Endennsss
  time: '2026-09-17T16:00:00+00:00'
  changes:
  - type: Tweak
    message: Бросок на R стал длиннее и плавно переходит в скольжение лёжа, а вставание теперь занимает две секунды и прерывается движением или уроном.
  - type: Add
    message: Прыжок на месте теперь доступен по пробелу без направления движения.
  - type: Fix
    message: Ползущий персонаж отображается под мебелью.
- id: 12
  author: Endennsss
  time: '2026-09-17T12:00:00+00:00'
  changes:
  - type: Add
    message: Добавлены добровольное ползание на R, кувырки во время движения и прыжки на пробел с расходом выносливости.
- id: 6
  author: Endennsss
  time: '2026-09-16T18:00:00+00:00'
  changes:
  - type: Fix
    message: Ползунки, числовые поля и списки настроек больше не вытесняются за край длинными подписями.
- id: 5
  author: Endennsss
  time: '2026-09-16T17:00:00+00:00'
  changes:
  - type: Fix
    message: Рамки полей ввода, заголовки окон, переключатели и ползунки настроек приведены к серой палитре.
- id: 3
  author: Endennsss
  time: '2026-09-16T12:00:00+00:00'
  changes:
  - type: Fix
    message: Оставшиеся цветные фоны, рамки и строки списков приведены к серой палитре, включая панель рук и ячейки инвентаря; цвета предметов, предупреждений и статусов сохранены.
- id: 1
  author: Endennsss
  time: '2026-09-15T00:00:00+00:00'
  changes:
  - type: Tweak
    message: Интерфейс переведён на общую серую палитру, включая рамки КПК, чат и служебные окна.
  - type: Fix
    message: Убрана задняя подложка сообщений речи и эмоций над персонажем.
